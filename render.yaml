# Render.com deployment manifest.
#
# Two services per environment:
#   - web:    HTTP server (node ./index.js). Auto-restarted on deploy.
#   - worker: BullMQ consumer (node ./workers/index.js). Separate process
#             group so a slow job can't block web dynos and a web deploy
#             can't interrupt an in-flight long job.
#
# Mongo + Redis are provisioned externally (Mongo Atlas / Upstash Redis)
# and surfaced through env group references so the same manifest
# produces staging + prod with only the env-group pointer changed.
#
# Secrets (`sync: false`) must be set in the Render dashboard per env.
# Everything else is checked into source so deploys are reproducible.

services:
  - type: web
    name: matjar-api
    runtime: node
    plan: standard
    region: oregon
    branch: master
    buildCommand: npm ci && npm run build:dashboard && npm run build:platform-admin && bash scripts/build-themes.sh
    # Apply any pending DB migrations before the web process starts. Running
    # in preDeployCommand (not buildCommand) ensures the DB is only touched
    # once per deploy, rather than once per instance when numInstances > 1.
    # The `--production` flag is required because NODE_ENV=production on
    # this service; scripts/migrate.js refuses to apply migrations in prod
    # without it, as a guard against accidental runs from a local env that
    # happens to have production creds in its shell.
    preDeployCommand: npm run migrate:production
    startCommand: node ./index.js
    healthCheckPath: /health
    numInstances: 2
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PLATFORM_DOMAIN
        sync: false
      - key: UPLOAD_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Manual payment rails (cash on delivery, bank transfer, Fawry, etc.)
      # are always on for soft launch. Gateway providers (Stripe) are
      # parked behind their own per-provider flag — set STRIPE_ENABLED to
      # "true" in the dashboard alongside its secrets to re-expose the
      # gateway routes.
      - key: PAYMENTS_ENABLED
        value: "true"
      - key: STRIPE_ENABLED
        value: "false"
      - key: SSL_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      # Custom-domain edge target — merchants CNAME their custom
      # hostnames to this value. Set to the web service's public
      # hostname (e.g. `<name>.onrender.com`) or a branded edge
      # CNAME that itself points at Render. Required in production;
      # `dnsTargetCheck` hard-fails the boot check without it.
      - key: PLATFORM_EDGE_CNAME
        sync: false
      - key: PLATFORM_EDGE_IP
        sync: false
      # Sentry — DSN is a secret (per-env), other vars are inherited
      # from Render's build env when available.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_RELEASE
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Browser-side Sentry. Vite only exposes env vars prefixed `VITE_`
      # to client bundles, so the backend DSN above is NOT visible to
      # dashboard/platform-admin code. Set VITE_SENTRY_DSN separately in
      # Render (point it at a *browser* Sentry project, ideally a
      # separate project from the backend so you can filter by platform).
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_RELEASE
        sync: false
      # Source-map upload for dashboard + platform-admin. Both vite
      # configs gate on all three being present; missing any one is a
      # no-op so forks / non-Sentry deploys still build clean. Set
      # SENTRY_PROJECT_PLATFORM_ADMIN when dashboard and platform-admin
      # live in distinct Sentry projects; omit it to reuse SENTRY_PROJECT.
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_PROJECT_PLATFORM_ADMIN
        sync: false

  - type: worker
    name: matjar-worker
    runtime: node
    plan: standard
    region: oregon
    branch: master
    buildCommand: npm ci
    startCommand: node ./workers/index.js
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PLATFORM_DOMAIN
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SSL_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      # Worker runs the domain-verification jobs, which depend on the
      # same edge target config as the web service. SSL certificates
      # are issued at the Cloudflare edge — no cert-issuance job here.
      - key: PLATFORM_EDGE_CNAME
        sync: false
      - key: PLATFORM_EDGE_IP
        sync: false
      - key: UPLOAD_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Sentry for the worker process — same DSN or a separate worker
      # project, set in the Render dashboard.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_RELEASE
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Automated backups — daily @ 03:00 UTC. The worker spawns
      # mongodump and streams the gzipped archive into a Cloudflare R2
      # bucket via the S3-compatible API. Retention: 30 daily + 12
      # monthly snapshots. Set BACKUP_ENABLED=true here (and provide
      # all BACKUP_S3_* secrets in the dashboard) to activate; leave
      # "false" to keep the cron idle.
      #
      # NOTE: mongodump is NOT on the default Render Node image. Either
      # switch this worker to a Docker runtime with MongoDB Database
      # Tools preinstalled, or run the backup job from a separate
      # Render Cron service that uses a mongo-tools image. The job
      # will fail loudly with "mongodump spawn failed" if the binary
      # is missing — verify after the first cron tick.
      - key: BACKUP_ENABLED
        value: "false"
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        value: auto
