<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutreko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
      <script>
      (function () {
        try {
          var stored = localStorage.getItem('matjar.storefront.lang');
          var nav = (navigator.language || '').toLowerCase();
          var lang = stored === 'ar' || stored === 'en'
            ? stored
            : (nav.indexOf('ar') === 0 ? 'ar' : 'en');
          var dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.lang = lang;
          document.documentElement.dir = dir;
          document.documentElement.setAttribute('dir', dir);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
