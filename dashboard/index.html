<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover enables env(safe-area-inset-*) on notched phones.
         interactive-widget=resizes-content makes the soft keyboard shrink the
         LAYOUT viewport (so 100dvh + the app shell's internal scroll adapt and
         restore) instead of scrolling the whole document up — which otherwise
         leaves whitespace where the content was once the keyboard closes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Matjar" />
    <title>Matjar</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('matjar.dashboard.lang');
          var nav = (navigator.language || '').toLowerCase();
          var lang = stored === 'ar' || stored === 'en'
            ? stored
            : (nav.startsWith('ar') ? 'ar' : 'en');
          var dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.lang = lang;
          document.documentElement.dir = dir;
          document.documentElement.setAttribute('dir', dir);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
